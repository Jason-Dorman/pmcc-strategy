[project]
name = "pmcc"
version = "0.1.0"
description = "Symbol-agnostic Poor Man's Covered Call backtester on LSEG hourly data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lseg-data==2.1.1",
    "pandas==2.3.3",
    "numpy>=2.5",
    "polars>=1.44",
    "pyarrow>=25.0",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "scipy>=1.18",
    "structlog>=26.1",
    "typer>=0.27",
    "tzdata>=2026.4",
]

[project.scripts]
pmcc = "pmcc.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pre-commit>=4",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# Quality gates (P0-04). The reference files stay unlinted and unchecked (DEC-57).
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["lseg_client.py", "theme.py"]
# Honour the excludes when pre-commit passes file names explicitly.
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "PT", "RUF", "C90"]
# `›` is the docs' citation separator (Spec › CLI). `×` and `−` are the spec's math signs in rule
# text (`spot ≥ short strike − 0.25 × EM`), which the rule YAML and its tests quote (DEC-90).
allowed-confusables = ["›", "×", "−"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["pmcc", "tests"]
exclude = ["lseg_client.py", "theme.py", "**/__pycache__"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests import shared fakes as `tests.fakes` (DEC-83).
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
