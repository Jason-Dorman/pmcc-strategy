# The sensitivity runs (Spec › Sensitivity checks; ARCHITECTURE §11): robustness reporting, not
# optimization, so every result is published and none is picked as the best (HR-6).
#
# Each entry is a strategy variant written as an ablation file is, inline: it `extends` a strategy
# file (relative to this one) and changes only what its check varies, through `fill_model` or
# `overrides` keyed by rule ID (DEC-53). Its run ID is the strategy's ID, `--`, a suffix. Every
# variant keeps a summary (PO, DEC-54). Loaded by pmcc.config.matrix, which runs them after the two
# strategies and the five ablations: 24 runs per symbol.
#
# The three lists are the three checks, and each is its own robustness table (P6-06): a variant
# sits in its check's table against the strategy it extends.

# ── Friction: both strategies at spread_capture 0.25 and 0.50 (the strategies run at 0) ───────
friction:
  - id: baseline_pmcc--sc025
    name: "Friction: baseline at spread capture 0.25"
    extends: baseline_pmcc.yaml
    report: {detail: summary}
    fill_model: {spread_capture: 0.25}

  - id: baseline_pmcc--sc050
    name: "Friction: baseline at spread capture 0.50"
    extends: baseline_pmcc.yaml
    report: {detail: summary}
    fill_model: {spread_capture: 0.50}

  - id: quant_pmcc--sc025
    name: "Friction: quant at spread capture 0.25"
    extends: quant_pmcc.yaml
    report: {detail: summary}
    fill_model: {spread_capture: 0.25}

  - id: quant_pmcc--sc050
    name: "Friction: quant at spread capture 0.50"
    extends: quant_pmcc.yaml
    report: {detail: summary}
    fill_model: {spread_capture: 0.50}

# ── Entry timing (PO, DEC-31): the baseline with E-T1 replaced by a fixed bar of the week-open
# session, one run per session bar. Every bar's rule has the same text (the aliases set in t1)
# and E-T1's spread limits (a test holds them equal); only `bar` changes. ─────────────────────
timing:
  - id: baseline_pmcc--t1
    name: "Timing: baseline, short decided on bar 1 (10:00)"
    extends: baseline_pmcc.yaml
    report: {detail: summary}
    overrides:
      E-T1:
        replace:
          name: &timing_name Entry trigger, fixed bar
          kind: fixed_bar_trigger
          params: {bar: 1, long_max_spread: 0.03, short_max_spread: 0.10}
          condition: &timing_condition >-
            The selected contract has a valid bid and ask, and its spread is at most
            {long_max_spread:.0%} of mid for the long leg or {short_max_spread:.0%} for the short
            leg
          action: &timing_action >-
            Enter the long on the first bar of the session where the condition holds. Decide the
            short only on session bar {bar} of the week-open session (bar 1 ends at 10:00): sell
            it if the condition holds there, or else the no-quote gate skips the week
          rationale: &timing_rationale >-
            The entry-timing check: the baseline with its liquidity-based entry trigger replaced
            by a fixed bar of the week-open session, run once for each of its bars. Large dispersion in
            results across the bars is reported as fragility.

  - id: baseline_pmcc--t2
    name: "Timing: baseline, short decided on bar 2 (11:00)"
    extends: baseline_pmcc.yaml
    report: {detail: summary}
    overrides:
      E-T1:
        replace:
          name: *timing_name
          kind: fixed_bar_trigger
          params: {bar: 2, long_max_spread: 0.03, short_max_spread: 0.10}
          condition: *timing_condition
          action: *timing_action
          rationale: *timing_rationale

  - id: baseline_pmcc--t3
    name: "Timing: baseline, short decided on bar 3 (12:00)"
    extends: baseline_pmcc.yaml
    report: {detail: summary}
    overrides:
      E-T1:
        replace:
          name: *timing_name
          kind: fixed_bar_trigger
          params: {bar: 3, long_max_spread: 0.03, short_max_spread: 0.10}
          condition: *timing_condition
          action: *timing_action
          rationale: *timing_rationale

  - id: baseline_pmcc--t4
    name: "Timing: baseline, short decided on bar 4 (13:00)"
    extends: baseline_pmcc.yaml
    report: {detail: summary}
    overrides:
      E-T1:
        replace:
          name: *timing_name
          kind: fixed_bar_trigger
          params: {bar: 4, long_max_spread: 0.03, short_max_spread: 0.10}
          condition: *timing_condition
          action: *timing_action
          rationale: *timing_rationale

  - id: baseline_pmcc--t5
    name: "Timing: baseline, short decided on bar 5 (14:00)"
    extends: baseline_pmcc.yaml
    report: {detail: summary}
    overrides:
      E-T1:
        replace:
          name: *timing_name
          kind: fixed_bar_trigger
          params: {bar: 5, long_max_spread: 0.03, short_max_spread: 0.10}
          condition: *timing_condition
          action: *timing_action
          rationale: *timing_rationale

  - id: baseline_pmcc--t6
    name: "Timing: baseline, short decided on bar 6 (15:00)"
    extends: baseline_pmcc.yaml
    report: {detail: summary}
    overrides:
      E-T1:
        replace:
          name: *timing_name
