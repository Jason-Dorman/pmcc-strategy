# NYSE trading calendar, 2014-2024: the thesis tracker's history (TD-15). Loaded, joined to
# configs/calendar.yaml (2025-2027, unchanged), by pmcc.thesis.calendar only: the backtests, the
# live wheel and `pmcc probe` read configs/calendar.yaml alone, so nothing they do changes.
#
# The same schema and conventions as configs/calendar.yaml: every weekday from first_day to
# last_day is a session unless it is listed under `closed`; an `early_closes` day ends at 13:00 ET.
# A holiday on a Saturday is observed the Friday before, and on a Sunday the Monday after, except
# that NYSE does not close on Friday Dec 31 when New Year's Day falls on a Saturday (2022).
# Juneteenth is a holiday from 2022. One special closure falls in the span: Dec 5 2018 (President
# George H.W. Bush). Hurricane Sandy's closures (Oct 29-30 2012) are before it.
#
# Each listed day is checked against NYSE's holiday rules by tests/unit/thesis/test_thesis_calendar.py,
# and the table is to be checked against the S&P 500 index's daily tape once T1-01's probe pulls it.
source:
  - "NYSE, Holidays & Trading Hours, https://www.nyse.com/markets/hours-calendars"
  - "NYSE Rule 7.2 (Holidays): Saturday holidays observed the Friday before, Sunday holidays the Monday after; no closure on Dec 31 for a Saturday New Year's Day"
  - "NYSE, NYSE to Close Markets on Wednesday, December 5, 2018 to Honor President George H.W. Bush (Dec 2018), https://ir.theice.com/press/news-details/2018/NYSE-To-Close-Markets-On-Wednesday-December-5-2018-To-Honor-President-George-HW-Bush/default.aspx"
