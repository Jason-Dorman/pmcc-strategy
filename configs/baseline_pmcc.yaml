# The baseline PMCC (Spec › Strategies): the textbook PMCC. Fixed selection (E-L2 and E-L3 by
# target DTE and delta, E-S3 at a fixed delta), gates G-1 and G-2 only, and the shared exits.
# Everything else is in _shared.yaml; this file adds only what the baseline selects by.

id: baseline_pmcc
name: Baseline PMCC
extends: _shared.yaml

# What its results keep and its page shows (PO, DEC-54): every row, plus the Greek attribution
# and the position Greeks (PO, DEC-120). Only quant's page shows the gate log.
report:
  detail: full
  sections: [greek_attribution, position_greeks]

rules:
  - id: E-L2
    name: Long leg expiry
    kind: nearest_dte_expiry
    params: {target_dte: 180}
    title: Which expiry do we use for the long call?
    summary: The monthly expiry closest to {target_dte} days out.
    condition: Monthly expiries listed at the decision bar
    action: Choose the monthly expiry nearest {target_dte} days to expiry
    rationale: >-
      The textbook PMCC long: a monthly about {target_dte} days out. Under Reg T a listed option
      with 9 months or less to expiry has no loan value, so the long is always paid in full.

  - id: E-L3
    name: Long leg strike
    kind: nearest_delta_long
    params: {target_delta: 0.80}
    title: Which long call do we buy?
    summary: The call with delta closest to {target_delta:.2f}.
    condition: Eligible calls on the long leg's expiry
    action: Choose the strike with delta nearest {target_delta:.2f}
    rationale: >-
      The long call is our stock substitute: a deep in-the-money, long-dated call, here the
      textbook PMCC's {target_delta:.2f}-delta version.

  - id: E-S3
    name: Short leg strike
    kind: nearest_delta_short
    params: {target_delta: 0.30}
    title: Which short strike do we sell?
    summary: The out-of-the-money call with delta closest to {target_delta:.2f}.
    condition: Eligible out-of-the-money calls on the short leg's expiry
    action: Choose the strike with delta nearest {target_delta:.2f}
    rationale: >-
      The textbook PMCC short: a weekly out-of-the-money call at a fixed delta.

      If that strike fails the entry trigger or the structural safety check, the week is skipped:
      we never substitute another strike.
