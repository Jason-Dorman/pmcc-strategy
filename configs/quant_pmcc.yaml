# The quant PMCC (Spec › Strategies): the cheapest-replacement long leg (E-L2 and E-L3), the
# expected-move short strike (E-S3), gates G-1 to G-5, and the shared exits. Everything else is in
# _shared.yaml; this file adds only what the quant strategy selects and skips by. The ablations in
# ablations/ each switch one of these layers off (DEC-53).

id: quant_pmcc
name: Quant PMCC
extends: _shared.yaml

rules:
  - id: E-L2
    name: Long leg expiry
    kind: dte_range_expiry
    params: {min_dte: 120, max_dte: 270}
    condition: Monthly expiries listed at the decision bar
    action: >-
      Keep every monthly expiry from {min_dte} to {max_dte} days to expiry; E-L3 chooses across
      them
    rationale: >-
      The long can be any monthly in the range, so E-L3 looks for the cheapest replacement across
      all of them. A listed option with 9 months or less to expiry has no loan value under Reg T;
      capping the range at {max_dte} days keeps the long always fully paid.

  - id: E-L3
    name: Long leg strike
    kind: cheapest_replacement
    params: {min_delta: 0.70, max_delta: 0.90}
    condition: >-
      Eligible calls with delta from {min_delta:.2f} to {max_delta:.2f} across the E-L2 expiries
    action: >-
      Choose the lowest extrinsic ÷ delta, where extrinsic = mid − max(0, spot − strike). Ties go
      to the lower spread % of mid, then the earlier expiry, then the lower strike
    rationale: >-
      The cheapest-replacement long leg: the long call is the stock substitute, and among the
      eligible calls it buys the one with the least extrinsic value per unit of delta.

  - id: E-S3
    name: Short leg strike
    kind: expected_move_strike
    params: {k: 1.0}
    condition: >-
      Eligible calls on the E-S2 expiry. EM is that week's at-the-money straddle mid: the ATM call
      mid + the ATM put mid
    action: Choose the lowest listed strike ≥ spot + {k} × EM
    rationale: >-
      The expected-move short strike: the short is sold at least {k} × the week's expected move
      above spot, the expected move being the at-the-money straddle's mid. If the selected strike
      fails E-T1 or E-S5, the skip-week gates decide; no other strike is substituted.

  # ── The quant layer's skip-week gates, evaluated after G-1 and G-2 ─────────────────────────
  - id: G-3
    name: Event week
    kind: event_ratio_gate
    params: {max_ratio: 1.20}
    condition: Front-week ATM IV ÷ next-week ATM IV > {max_ratio:.2f}
    action: Skip the week; keep the long
    rationale: >-
      G-3 detects events (usually earnings) from the chain itself, with no external calendar: an
      event priced into the front week lifts its IV above the following week's. A ratio is used
      instead of a vol-point difference so the threshold scales across low- and high-volatility
      symbols.

  - id: G-4
    name: Volatility risk premium
    kind: vrp_gate
    params: {min_ratio: 1.00}
    condition: Front-week ATM IV ÷ RV20 < {min_ratio:.2f}
    action: Skip the week; keep the long
    rationale: >-
      The volatility risk premium gate: the week is skipped when the front week's implied
      volatility is below the stock's realized volatility over the last 20 sessions (RV20).

  - id: G-5
    name: Minimum premium
    kind: min_premium_gate
    params: {min_mid: 0.10}
    condition: Selected short mid < ${min_mid:.2f} per share
    action: Skip the week; keep the long
    rationale: >-
      A short that would collect less than ${min_mid:.2f} a share isn't sold, and no other strike
      is tried in its place.
