# The backtest universe (Spec › Universe), set by the PO at P1-05 on 2026-09-28. Loaded by
# pmcc.config.universe, which checks the window against configs/calendar.yaml.
#
# `starting_cash`, with its basis, is the last block: `pmcc calibrate` writes it (P3-09, DEC-30),
# so keys added later, like P6-05's bootstrap seed (DEC-61), go above it.

# One window for every symbol (DEC-07): 26 weeks, 125 sessions. The stock tape's 30-session
# warm-up starts Fri Feb 13 2026, inside LSEG's hourly history (which reaches late Oct 2025).
window:
  start: 2026-03-30  # Mon: a week-open session, and the first E-L1 session
  end: 2026-09-25    # Fri: the last complete week before the universe fetch

# r: one constant for the window, continuously compounded (DEC-11). The 3-month Treasury yield at
# the last close before the window, so the first decision could have known it. The loader checks
# that `value` is `quoted_pct` converted over a 91-day bill, rounded to 4 decimals.
risk_free_rate:
  value: 0.0371
  quoted_pct: 3.73
  series: DGS3MO
  as_of: 2026-03-27
  source: >-
    Board of Governors of the Federal Reserve System (H.15), Market Yield on U.S. Treasury
    Securities at 3-Month Constant Maturity, Quoted on an Investment Basis (DGS3MO), via FRED,
    Federal Reserve Bank of St. Louis, https://fred.stlouisfed.org/series/DGS3MO (read 2026-09-28)

# The bootstrap (PO, DEC-61): each 95% CI of a mean weekly return, per run and pooled, draws its
# 10,000 resamples from numpy's PCG64 seeded with this, and records it. Any fixed value would do;
# this one is the course number. A new seed changes every CI, so re-run every result after.
bootstrap:
  seed: 535

# The universe (DEC-15): an index ETF and two single names across a wide volatility range, cut by
# the PO from the first plan's twelve. Each at its primary listing, Nasdaq .O (DEC-12); the option
# roots are the tickers.
#
# NVDA only for now (PO, 2026-09-30, DEC-15): QQQ and TSLA are set aside, commented out rather than
# removed, and come back at the end if time allows. Each symbol has its own starting cash (PO,
# 2026-10-05, DEC-30), so bringing one back leaves the others' alone: uncomment the symbol; finish
# its fetch (P1-10); run `just calibrate` (it calibrates only symbols without a final value); then
# run the batch (`just batch`).
symbols:
  # - {symbol: QQQ, stock_ric: QQQ.O, option_root: QQQ}
  - {symbol: NVDA, stock_ric: NVDA.O, option_root: NVDA}
  # - {symbol: TSLA, stock_ric: TSLA.O, option_root: TSLA}

# ── Starting cash: written by `pmcc calibrate` (Spec › E-L4; DEC-30) ────────────────────────────
# Each symbol's own: E-L4's cash_multiple × that symbol's most expensive first long-leg entry cost
# (E-L1: fill × 100 × qty + fees, at spread_capture 0), rounded up to its cash_round_to. Every run
# on the symbol uses it unchanged. Each entry is one run's first long-leg entry, measured at
# `calibration_cash`, which is never a run's starting cash; every run was then checked to make all
# its entries at its symbol's `value` (no E-L4 block). A symbol stays `provisional` until it is
# calibrated under both strategies. Don't edit this block: `pmcc calibrate` replaces a provisional
# symbol and adds a missing one, `pmcc calibrate --check` recomputes it byte for byte, and a final
# symbol is only ever removed by hand.
starting_cash:
  cash_multiple: 2
  cash_round_to: '5000.0000'
  calibration_cash: '1000000.0000'
  symbols:
  - symbol: NVDA
    value: '15000.0000'
    provisional: false
    entries:
    - strategy: baseline_pmcc
      time: '2026-03-30T10:00:00-04:00'
      contract: NVDAI182613500.U^I26
      cost: '4142.5000'
    - strategy: quant_pmcc
      time: '2026-03-30T10:00:00-04:00'
      contract: NVDAH212611500.U^H26
      cost: '5630.0000'
