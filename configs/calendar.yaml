# NYSE trading calendar, 2025-2027 (DEC-33). Loaded by pmcc.config.calendar.
#
# Every weekday from first_day to last_day is a session (09:30-16:00 ET) unless it is listed
# under `closed`. An `early_closes` day ends at 13:00 ET (eligible options trade to 13:15; the
# backtest's last session bar on that day ends at 13:00, DEC-06). Holidays that fall on a Saturday
# are observed on the Friday before, and those on a Sunday on the Monday after, as NYSE lists them.
#
# The stock tape must agree with this table: a day with regular-hours bars that the table closes,
# or a table session with no bars, stops the plan and the load (DEC-33, PO 2026-09-27).
source:
