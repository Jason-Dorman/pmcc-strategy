# CI (ARCHITECTURE §14). Builds only from committed files: no cache, no secrets,
# never contacts LSEG (§15). Tools run at the uv.lock versions (DEC-77).
# `python` checks the code and verifies the committed results (DEC-51); `web` exports them, checks
# and builds the site and guards the build; `deploy` publishes it to GitHub Pages from main only
# (P4-07, DEC-98).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Reject tracked credentials
        run: |
          if git ls-files | grep -E '(^|/)lseg-data\.config\.json$'; then
            echo "lseg-data.config.json is tracked; credentials must never be committed (LDG §1)." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install from uv.lock
        run: uv sync --frozen

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit on all files (ruff, format, pyright, guards)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      - name: pytest
        run: uv run --frozen pytest
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Verify the committed results (DEC-51)
        run: uv run --frozen pmcc verify results/

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install from uv.lock
        run: uv sync --frozen

      - name: Export the committed results (pmcc export verifies them first)
        run: uv run --frozen pmcc export --out web/public/data/

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from package-lock.json
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck against the exported schema (INV-14)
        working-directory: web
        run: npm run typecheck

      - name: Vitest
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Dist guard (no LSEG, no Google Fonts)
        working-directory: web
        run: npm run guard

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
